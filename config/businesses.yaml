    metadata:
      description: 'Meeting House Tavern is an LGBTQIA+ bar in Andersonville featuring a full bar with daily drink specials and happy hours. The venue offers free pool, board games, darts, shuffleboard, and Skee-Ball, along with weekly entertainment including trivia, bingo, karaoke, and poker nights.'
