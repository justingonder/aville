      The dining room and tavern area fill with an energetic crowd nightly, with happy hour running Tuesday through Sunday from 4–6pm in the tavern and on the patio (no reservations for happy hour). Dinner service runs Sunday 4–8:30pm, Tuesday–Thursday 4–9pm, and Friday–Saturday 4–10pm. The restaurant welcomes both casual drop-ins and guests booking reservations through Resy.
