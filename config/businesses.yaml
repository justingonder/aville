      The restaurant operates Tuesday through Thursday and Friday from 5–10 p.m., with weekend service starting at 3 p.m. (Sat–Sun until 9 p.m. on Sunday). Daily happy hour is available, and the space accommodates private events and celebrations. The staff includes knowledgeable sommeliers who guide wine pairings, and the kitchen prepares dishes with attention to detail—from appetizers like Brussels sprouts with pork belly and fried zucchini with mole to mains such as scallops and steak with farro risotto.
