    about: |
      Lonesome Rose opened in Logan Square in 2017 and expanded to Andersonville in 2023, building a reputation for Tex-Mex food executed with care. The menu centers on breakfast tacos, margaritas, and quesaritos—dishes the restaurant treats as essential rather than novelty. The space is light-filled and open, earning a James Beard Foundation Outstanding Design Award finalist nod in 2019, and the restaurant has appeared on Michelin's Bib Gourmand list multiple times.

      Both locations operate all day, with weekend brunch service running until 2 p.m. The restaurant welcomes large groups and offers family-style menus for parties of six to eighteen. Lonesome Rose also runs Culebra, a basement bar in Logan Square open late Tuesday through Sunday, and Sweethearts Bar, a separate cocktail spot next door to the Andersonville location.
