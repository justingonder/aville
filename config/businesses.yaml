    vibe_quote: 'Lunch and brunch on weekends; noodles most nights.'
    about: |
      Minyoli serves Taiwanese noodles made in-house, with beef noodle soup as a signature dish. The menu draws from juancun (military-village) cooking traditions and includes braised and fried snacks, desserts, and cocktails alongside both traditional and contemporary noodle preparations. The kitchen operates limited hours—lunch service Wednesday through Saturday, brunch on Sundays, and dinner most nights.

      The restaurant takes reservations through Tock and handles inquiries by email. It's a neighborhood spot for those seeking specific regional Taiwanese cooking rather than a broad pan-Asian menu. Hours shift seasonally between a regular noodles menu and a brunch-only Sunday service, so checking ahead is worth the effort.

