      The museum is open Tuesday through Sunday with extended hours on select evenings. The Brunk Children's Museum has its own schedule, operating afternoons on weekdays and mornings through early afternoon on weekends. Admission is free for members and children under one, and free for all visitors on the second Tuesday of each month. All spaces are wheelchair accessible.
