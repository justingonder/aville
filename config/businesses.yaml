# List of businesses to scrape.
# Each business has one or more pages to extract from.
#
# page.kind is a hint that shapes the extraction prompt:
#   - "events" = page is about events, shows, programming
#   - "menu"   = menu page, extract happy hours / specials only
#   - "home"   = general landing page, scan for any event-like content
#
# page.hints is free-form text passed to the extractor so it knows
# what to expect on this specific page. Worth a sentence or two.
#
# default_tags (optional) is applied to every event extracted for this
# business, merged with whatever tags Claude produces. Use this for tags
# that are invariant for the business — e.g., every event at an LGBTQ+
# 21+ bar is both "lgbtq" and "21-plus". Duplicates are deduped.

businesses:
  - slug: vincent
    name: Vincent
    category: restaurant
    subcategory: french-bistro
    website: https://www.vincentchicago.com/
    address: 1475 W. Balmoral Ave., Chicago, IL 60640
    pages:
      - url: https://www.vincentchicago.com/
        kind: home
        hints: >
          Wix site fetched with a headless browser, so the JavaScript-rendered
          modal IS present in the HTML. The modal contains event flyer images —
          expect roughly 3 flyers at time of writing: Happy Hour, a seasonal
          dated special (e.g. Easter Brunch), and a food/drink recurring special
          (e.g. Half Off Mussels). Extract all of them. Happy Hour also appears
          as text in the footer ("Happy Hour Daily 4 - 6pm") — if the same event
          appears in both a flyer image and the footer text, MERGE the information
          from both sources into one event rather than picking one as authoritative;
          each source may contain details the other lacks. Venue hours for context:
          Sun–Thu 4pm–10pm, Fri–Sat 4pm–12am. This is a French bistro — expect
          food and drink specials rather than nightlife events.
        use_playwright: true

  - slug: atmosphere
    name: Atmosphere
    category: bar
    subcategory: nightclub
    website: https://atmospherebar.com/
    address: 5355 North Clark Street, Chicago, Illinois 60640
    default_tags:
      - lgbtq
      - 21-plus
    pages:
      - url: https://atmospherebar.com/
        kind: home
        hints: >
          GoDaddy Website Builder site. Event flyers are images on the wsimg.com
          CDN (img1.wsimg.com). Dates and event details are embedded as text INSIDE
          the flyer images — there is no date/time text in the surrounding HTML.
          The home page mixes recurring themed nights with dated one-off events.
          Extract ONLY recurring events from this page (e.g., weekly themed nights
          like Inferno Saturdays, Wednesday Broadway nights, 80s Cassette nights,
          The 90s recurring night). Do NOT extract dated one-off events from this
          page — those are captured from the Upcoming Events page and would create
          duplicates. Venue hours for context: Tue–Thu 6PM–12AM, Fri 6PM–2AM,
          Sat 3PM–3AM, Sun 3PM–12AM. This is a pop/dance nightclub — expect
          themed tribute nights, drag, DJ sets, and dance parties.
      - url: https://atmospherebar.com/upcoming-events
        kind: events
        hints: >
          GoDaddy Website Builder site. Images on wsimg.com CDN. This page shows
          upcoming dated one-off events as promotional flyers. Dates are embedded
          as text inside the flyer images; image filenames also hint at dates
          (e.g., a filename containing "04.05.26" suggests April 5, 2026 — use
          this as a cross-check, but trust the date visible in the flyer image
          itself. Extract ONLY dated (one-off) events from this page. Do NOT
          extract recurring events — those are captured from the home page.
          Known upcoming events as of 2026-04-18: Madonnarama (Apr 5), Planet
          Janet (Apr 26), Kacey Musgraves Release Party (May 2). If a flyer has
          no readable date, use the filename date as a fallback.
      - url: https://atmospherebar.com/daily-drink-specials
        kind: menu
        hints: >
          This page is currently blank/placeholder as of 2026-04-18. Return an
          empty list. Check future runs — content may be added later.

  - slug: meeting-house-tavern
    name: Meeting House Tavern
    category: bar
    subcategory: gay-bar
    website: https://meetinghousetavern.com/
    address: 5025 N. Clark St., Chicago, IL 60640
    default_tags:
      - lgbtq
      - 21-plus
    pages:
      - url: https://meetinghousetavern.com/events
        kind: events
        hints: >
          Squarespace site. Event flyers are images hosted on the Squarespace CDN;
          event names and details are embedded INSIDE the images. Day and time are
          in plain text below each image. Page has three sections: WEEKLY EVENTS,
          MONTHLY EVENTS, and SPECIAL EVENTS. Some flyers link out to Facebook or
          Instagram for details. This is an LGBTQ+ bar — expect drag, karaoke,
          bingo, trivia, and themed parties.

  - slug: replay-andersonville
    name: Replay Andersonville
    category: bar
    subcategory: barcade
    website: https://replaychicago.com/andersonville/home/
    address: 5358 N Clark St, Chicago, IL 60640
    default_tags:
      - 21-plus
      - video-gaming
    pages:
      - url: https://replaychicago.com/andersonville/events/
        kind: events
        hints: >
          WordPress site. Events are displayed as image cards pulled from the WordPress
          CDN (replaychicago.com/wp-content/uploads/). Replay has multiple Chicago
          locations — this page is Andersonville only; ignore any references to
          Lakeview or other locations. Known recurring events: Karaoke Mondays 9pm,
          Stewpendous Trivia Wednesdays 7pm, Dinner and Drag (RuPaul viewing party)
          Fridays 7pm, Weekend Brunch + Bubbly Happy Hour Saturdays and Sundays
          11am-3pm. Dated special events also appear as one-off cards with specific
          dates. It is a bar + arcade (barcade) — expect gaming, drag, karaoke,
          trivia, and brunch events.
      - url: https://docs.google.com/document/d/e/2PACX-1vSnGM52i9A9j54-k7Q3XAh01BATvdyM5XVhK7YuLn6KYDReEsmZ40CabcgvG7QAarXPqnYnrOk9w9TD/pub
        kind: menu
        hints: >
          This is a published Google Doc (text only, no images) that auto-updates
          every 5 minutes. It contains Replay Andersonville's daily specials and
          happy hours. Extract the following as recurring events or specials:
          (1) Weekday Happy Hour: Mon–Thu 4–6pm, food specials (Fried Pickles $7,
          Buffalo Chicken Egg Rolls $8, Replay Nachos $10). Extract as a single
          recurring event covering Mon–Thu. (2) Daily drink specials: Tuesday $7
          Seasonal Frozen Cocktail; Wednesday $6 Select Drafts & Shots + half-off
          wine bottles; Thursday $6 Three Olives or Jose Cuervo Tradicional drinks;
          Friday $6 Truly Cans + $7 Absolut Vodka drinks. Extract each day's
          specials as a separate recurring event. DO NOT extract or duplicate the
          following — they are already captured from the events page: Karaoke
          Mondays, Stewpendous Trivia (Wednesday), Dinner and Drag (Friday), or
          Weekend Brunch. Monday drink specials ($5 Cans, $4 Shots, $3 Bud Lights)
          are already captured as price_info on the Karaoke Monday event — do not
          create a separate Monday specials event. The weekend bubbly hour
          (Sat–Sun 12–2pm) is part of the Weekend Brunch event already extracted —
          do not create a duplicate.

  - slug: bar-roma
    name: Bar Roma
    category: restaurant
    subcategory: italian
    website: https://www.barromachicago.com/
    address: 5101 North Clark Street, Chicago, IL 60640
    pages:
      - url: https://www.barromachicago.com/dine-in-menu
        kind: menu
        hints: >
          Squarespace site. The menu itself is represented as seasonal JPG images
          (e.g., "BR Dinner menu winter" in the filename). Happy Hour is shown as a
          SEPARATE image on the same page, filename typically contains "HAPPY".
          Extract ONLY the happy hour (as a recurring event) and any clearly dated
          specials. Do NOT extract the full dinner or dessert menus as events.
