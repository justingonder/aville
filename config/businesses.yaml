    metadata:
      description: 'Arcade sports bar and restaurant in Andersonville featuring classic vintage arcade games, house-made comfort food, rotating craft beers, and seasonal cocktails. Offers brunch, dinner, and late-night service with a sports viewing area and free-to-play games throughout the space.'
      telephone: '+1-773-654-1369'
      price_range: '$$'
      same_as:
        - 'https://www.facebook.com/replayandersonvillechicago'
        - 'https://www.instagram.com/replayandersonvillechicago'
    tagline: 'Arcade sports bar and restaurant with house-made comfort food, rotating craft beers, and free-to-play vintage games.'
    vibe_quote: 'Drink. Play. Repeat.'
    about: |
      Replay Andersonville is an arcade sports bar and restaurant where vintage games, craft drinks, and house-made food share equal billing. The kitchen, led by Chef Bernardo Ibarra (formerly of Girl & the Goat), turns out scratch-made comfort dishes—cubano sandwiches, chicken and waffles, hot honey mustard wings with house-made ranch—alongside a rotating craft beer selection, seasonal cocktails, and a curated whiskey and bourbon list. The space fills with free-to-play arcade cabinets and pinball machines, plus a dedicated sports zone for catching games on multiple screens.

      Brunch runs Saturday and Sunday mornings with a bubbly happy hour, and the bar stays open late for games and drinks. The crowd is mixed and welcoming—regulars come for the consistent food and service, while newcomers find an upscale-but-relaxed sports bar atmosphere with board games, an outdoor patio, and a calendar packed with trivia nights, karaoke, and drag events. It reads as a neighborhood hangout that happens to have excellent food and a serious beer program.
