      Shows run Friday and Saturday nights at 10:30pm and Sunday evenings at 7pm. The space operates on a pay-what-you-can model and actively supports artists of color through scholarships and programming. Beyond The Infinite Wrench, the Neo-Futurarium hosts open gym sessions, workshops, and classes—all part of the company's stated mission to shift the conventions of live performance and reach audiences unmoved by traditional theater.
