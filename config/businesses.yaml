    metadata:
      description: 'Vincent is a neighborhood bistro in Andersonville offering seasonal menus with rustic yet refined dishes, craft cocktails made with fresh-squeezed juices and premium spirits, and a hand-selected wine list. The restaurant features live entertainment and provides a welcoming atmosphere for dining and drinks.'
      telephone: '+1-773-334-7168'
      price_range: '$$'
      same_as: []
    tagline: 'A neighborhood bistro with seasonal menus, craft cocktails made from fresh-squeezed juices, and live entertainment.'
    vibe_quote: 'Settle in, sip, and stay awhile.'
    about: |
      Vincent is a neighborhood bistro in Andersonville serving seasonal menus built around bold flavors and fresh ingredients. The kitchen blends rustic comfort with modern creativity, while the bar focuses on craft cocktails featuring fresh-squeezed juices, premium spirits, and inventive twists on classics. A hand-selected wine list rounds out the drinks program, and the restaurant hosts live entertainment throughout the week.

      The space welcomes diners and drinkers alike, with a daily happy hour from 4–6pm and a full bar program. Open Sunday through Thursday from 4pm–10pm and Friday and Saturday until midnight, Vincent draws a mix of neighborhood regulars and those looking for a full dining experience or a quick drink. Weekly specials complement the seasonal menu.
