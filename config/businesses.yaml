    tagline: 'An LGBTQIA+ bar with free pool, darts, and games, plus nightly entertainment and daily drink specials.'
    vibe_quote: 'No dress code. No attitude. Just good people.'
    about: |
      Meeting House Tavern is a queer-owned neighborhood bar in Andersonville with a full lineup of weekly events: drag-hosted trivia on Tuesdays, bingo on Wednesdays, karaoke on Thursdays, and poker nights on Sundays. The game room stays free all day—pool, darts, shuffleboard, Skee-Ball, and board games require no tokens or cover charge. Daily drink specials keep tabs light, with $5 happy hour on Friday evenings and $5 shots of Jager, Fireball, and Malort available around the clock.

      The space runs on a no-frills ethos: no dress code, no attitude, no cover ever. Events draw a mix of regulars and newcomers, from the theatrical energy of Karaoke Cabaret to the chill Saturday afternoon 80's throwback session. Hours vary by day—closed Mondays, open from 5pm most weeknights, and from 2pm on weekends—making it easy to drop in for a drink and a game or stay for the full event lineup.
