    tagline: 'A loose leaf tea retailer stocking black, green, oolong, herbal, and chai blends, plus matcha and teaware.'
    vibe_quote: 'Every cup is a journey. Every sip, a step forward.'
    about: |
      Eli Tea Bar sells loose leaf tea sourced from around the world—black, green, oolong, herbal, and chai varieties—along with matcha, teaware, and apparel. The shop operates a physical location in Chicago and ships online with free shipping on orders over $75. Blends range from house creations like Apple Ginger Spice and Brulee Puerh to international standards like Thai Chai and Kyoto Sencha Rose Festival.

      The shop hosts regular in-store events including Trivia Tuesday, Art Meetup Thursdays, and tea tastings. Kombucha is available on tap at the Chicago location. Customers can browse samplers, gift boxes, and brewing equipment, or place mobile drink orders for in-store pickup. The space functions as both a retail shop and a gathering spot for tea enthusiasts.
