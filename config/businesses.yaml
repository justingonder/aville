          from both sources into one event rather than picking one as authoritative;
          each source may contain details the other lacks. Venue hours for context:
          Sun–Thu 4pm–10pm, Fri–Sat 4pm–12am. This is a French bistro — expect
          food and drink specials rather than nightlife events.
        use_playwright: true

    metadata:
      description: 'Vincent is a neighborhood bistro in Andersonville offering seasonal menus with rustic yet refined dishes, craft cocktails made with fresh-squeezed juices and premium spirits, and a hand-selected wine list. The restaurant features live entertainment and provides a welcoming atmosphere for dining and drinks.'
