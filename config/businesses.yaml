          identify a past event, do not include it in the output array at all.

    metadata:
      description: 'Hopleaf Bar is a craft beer-focused neighborhood pub in Andersonville operating since 1992, featuring 62 taps of carefully selected beers, wines, spirits, and cocktails. The Belgian-inspired kitchen serves seasonal dishes including their signature mussels and frites, with thoughtfully sourced ingredients and in-house preparation.'
      telephone: '+1-773-334-9851'
      price_range: '$$'
      same_as: []
    tagline: 'Andersonville''s craft beer destination since 1992, with 62 taps and a Belgian-inspired kitchen known for mussels and frites.'
    vibe_quote: 'For drinking, eating, and talking with friends, new and old.'
    about: |
      Hopleaf has been a neighborhood fixture in Andersonville for over three decades, built around a carefully curated beer program that spans 62 taps and a deep bottle list. The Belgian-inspired kitchen serves seasonal dishes built on thoughtfully sourced ingredients and in-house preparation, with mussels and frites as the signature offering. The bar's decor reflects its beer heritage—enameled and printed brewery advertising from Belgium lines the rooms, a visual reminder of the culture that shaped the place.

      The space is deliberately stripped of screens, games, and live entertainment; it's designed for conversation and focus on what's in the glass and on the plate. Hopleaf draws both serious beer enthusiasts and neighborhood regulars, and operates as an adults-only venue (21+ with valid ID). Most seating is available for walk-ins, though limited reservations are now offered through Tock. Hours run noon to 11 p.m. Sunday through Thursday (kitchen closes at 10 p.m.), and noon to midnight Friday and Saturday (kitchen at 11 p.m.).
