name: Site rebuild

on:
  workflow_dispatch: {}  # manual trigger only — rebuilds site from committed DB, no extraction

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python scripts/build_site.py

      - name: Upload artifact (for debugging / manual review)
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public/
          retention-days: 7

      # Same SSH deploy as scheduled.yml — same secrets and variable required.
      - name: Deploy to Namecheap
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_KEY:  ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_PATH: ${{ vars.NAMECHEAP_SSH_PATH }}
        run: |
          set -e
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_PATH" ]; then
            echo "Error: Missing required SSH configuration"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -p 21098 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1; then
            echo "Warning: ssh-keyscan failed, but continuing..."
          fi
          if ! ssh -i ~/.ssh/id_ed25519 -p 21098 "$SSH_USER@$SSH_HOST" "echo 'SSH connection successful'" 2>&1; then
            echo "Error: SSH connection test failed"
            exit 1
          fi
          rsync -avz --delete --exclude='images/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p 21098" \
            public/ "$SSH_USER@$SSH_HOST:$SSH_PATH"
