name: Scheduled extraction + deploy

on:
  schedule:
    # Every day at 6:00 AM Chicago time (11:00 UTC during CDT).
    # Adjust as needed. Avoid every-hour — small businesses don't update that often
    # and you'd just be burning API credits.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(python -c 'import playwright, importlib.metadata as m; print(m.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install chromium --with-deps
          fi

      - name: Run extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL || 'claude-haiku-4-5-20251001' }}
        run: |
          python scripts/init_db.py
          python scripts/run_extraction.py

      - name: Build static site
        env:
          CHECK_IMAGES: "1"
        run: python scripts/build_site.py

      - name: Upload artifact (only on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public/
          retention-days: 14

      # ---- Deploy step: rsync over SSH to Namecheap shared hosting. ----
      # Requires three repo secrets:
      #   NAMECHEAP_SSH_HOST   (e.g. server123.web-hosting.com)
      #   NAMECHEAP_SSH_USER   (your cPanel username)
      #   NAMECHEAP_SSH_KEY    (private key, contents of an id_ed25519)
      # And one repo variable:
      #   NAMECHEAP_SSH_PATH   (e.g. /home/USER/public_html/andersonville/)
      #
      # To set up: generate a keypair locally, add the public key to cPanel
      # > SSH Access, and store the private key as the secret above.
      - name: Deploy to Namecheap
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_KEY:  ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_PATH: ${{ vars.NAMECHEAP_SSH_PATH }}
        run: |
          set -e
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_PATH" ]; then
            echo "Error: Missing required SSH configuration"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -p 21098 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1; then
            echo "Warning: ssh-keyscan failed, but continuing..."
          fi
          if ! ssh -i ~/.ssh/id_ed25519 -p 21098 "$SSH_USER@$SSH_HOST" "echo 'SSH connection successful'" 2>&1; then
            echo "Error: SSH connection test failed"
            exit 1
          fi
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p 21098" \
            public/ "$SSH_USER@$SSH_HOST:$SSH_PATH"

      # Commit the updated DB + any newly downloaded business flyer images
      # back to the repo so change-detection + build assertions work across
      # runs, and so historical flyers persist even when a source page stops
      # advertising the event. (og/ and og-home.jpg are gitignored — build
      # artifacts, not source data.)
      - name: Commit updated database and images
        run: |
          git config user.name  "andersonville-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/app.db public/images
          git diff --staged --quiet || git commit -m "chore: update event DB + images $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push

      - name: Purge Cloudflare cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
          -H "Authorization: Bearer $CF_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
