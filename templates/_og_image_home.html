{% from "_tower.html" import tower %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    background: #ddd0b0;
    overflow: hidden;
    position: relative;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Cork dot texture, full-bleed */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(26,24,18,.18) 1px, transparent 1px);
    background-size: 12px 12px;
  }

  /* Yellow tape strip across the top */
  .tape-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: #e8b84a;
    opacity: .75;
    z-index: 2;
  }

  /* A little rotated piece of yellow tape, like a pin */
  .tape-corner {
    position: absolute;
    top: 42px;
    right: 72px;
    width: 130px;
    height: 22px;
    background: #e8b84a;
    opacity: .78;
    transform: rotate(6deg);
    box-shadow: 0 1px 2px rgba(26,24,18,.18);
    z-index: 2;
  }
  .tape-corner::before,
  .tape-corner::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 8px;
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 3px,
      rgba(26,24,18,.25) 3px, rgba(26,24,18,.25) 4px
    );
  }
  .tape-corner::before { left: 0; }
  .tape-corner::after { right: 0; }

  /* Main stage */
  .stage {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    text-align: center;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 18px;
  }

  .lockup .tower {
    width: 140px;
    height: 186px;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-style: italic;
    font-size: 168px;
    letter-spacing: -.04em;
    line-height: .9;
    color: #1a1812;
  }
  .wordmark .dot { color: #e8b84a; font-style: normal; }

  .place {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: #4a4338;
    margin-top: 8px;
  }

  .rule {
    width: 120px;
    height: 2px;
    background: #1a1812;
    opacity: .35;
    margin: 28px auto 24px;
  }

  .pitch {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: 36px;
    line-height: 1.15;
    color: #1a1812;
    max-width: 760px;
    letter-spacing: -.01em;
  }

  .pitch .accent {
    color: #b84435;
    font-style: italic;
  }

  /* Bottom corner URL pill */
  .pill {
    position: absolute;
    bottom: 34px;
    right: 40px;
    z-index: 3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #1a1812;
    border: 1.5px solid rgba(26,24,18,.45);
    padding: 6px 14px 5px;
    background: rgba(255,253,245,.4);
  }

  /* Issue number pill, bottom-left */
  .issue {
    position: absolute;
    bottom: 34px;
    left: 40px;
    z-index: 3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #4a4338;
  }
</style>
</head>
<body>

<div class="tape-top"></div>
<div class="tape-corner"></div>

<div class="stage">
  <div class="lockup">
    {{ tower() }}
    <div class="wordmark">Aville<span class="dot">.</span>net</div>
  </div>
  <div class="place">Andersonville · Chicago</div>

  <div class="rule"></div>

  <div class="pitch">
    Events, happy hours <span class="accent">&amp;</span> everything else<br>
    happening in the neighborhood.
  </div>
</div>

<div class="issue">Updated daily</div>
<div class="pill">aville.net</div>

</body>
</html>
