<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,900&family=JetBrains+Mono:wght@500;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #ddd0b0;
  }

  /* ── Image zone: full width, sits above the banner ── */
  .image-zone {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 118px;
    background: #ddd0b0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Cork dot texture */
  .image-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(26,24,18,.18) 1px, transparent 1px);
    background-size: 12px 12px;
  }

  .image-zone img {
    position: relative;
    z-index: 1;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ── Poster (no-image fallback) ── */
  .poster {
    position: relative;
    z-index: 1;
    width: 344px;
    height: 430px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px 28px;
    text-align: center;
    overflow: hidden;
  }

  .poster::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1px);
    background-size: 10px 10px;
  }

  .p-yellow { background: #e8b84a; }
  .p-red    { background: #b84435; }
  .p-cream  { background: #fffdf5; border-top: 4px double #1f4c7a; }
  .p-ink    { background: #1a1812; }
  .p-stripe {
    background: #fffdf5;
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 12px,
      rgba(31,76,122,.08) 12px, rgba(31,76,122,.08) 13px
    );
  }

  .poster .p-biz {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    position: relative;
  }
  .p-yellow .p-biz, .p-stripe .p-biz, .p-cream .p-biz { color: #1f4c7a; }
  .p-red .p-biz    { color: #e8b84a; }
  .p-ink .p-biz    { color: #e8b84a; }

  .poster .p-title {
    font-family: 'Rubik Mono One', sans-serif;
    font-size: clamp(22px, 8cqw, 52px);
    line-height: .9;
    letter-spacing: -.01em;
    position: relative;
    overflow-wrap: anywhere;
    word-break: break-word;
    hyphens: auto;
  }
  .p-yellow .p-title { color: #b84435; }
  .p-red .p-title    { color: #fffdf5; }
  .p-cream .p-title  { color: #1f4c7a; }
  .p-ink .p-title    { color: #e8b84a; }
  .p-stripe .p-title { color: #1f4c7a; }

  .poster .p-when {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    position: relative;
  }
  .p-yellow .p-when, .p-stripe .p-when, .p-cream .p-when { color: #1a1812; opacity: .7; }
  .p-red .p-when    { color: #e8b84a; }
  .p-ink .p-when    { color: rgba(232,222,196,.6); }

  /* ── Banner ── */
  .banner {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 118px;
    background: #1a1812;
    display: flex;
    align-items: center;
    padding: 0 36px;
    z-index: 10;
  }

  /* Yellow tape line at top edge of banner */
  .banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: #e8b84a;
    opacity: .7;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
  }

  .tower {
    width: 38px;
    height: 50px;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-style: italic;
    font-size: 44px;
    letter-spacing: -.035em;
    line-height: 1;
    color: #fffdf5;
  }
  .wordmark .apos { color: #b84435; font-style: normal; }
  .wordmark .dot  { color: #e8b84a; font-style: normal; }

  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(232,222,196,.42);
    margin-top: 5px;
  }

  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #e8b84a;
    border: 1px solid rgba(232,184,74,.35);
    padding: 4px 12px 3px;
    opacity: .85;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="image-zone">
  {% if image_rel_path %}
  <img src="{{ image_rel_path }}" alt="">
  {% else %}
  <div class="poster {{ poster_variant }}" style="container-type:inline-size">
    <div class="p-biz">{{ poster_business }}</div>
    <div class="p-title">{{ poster_title }}</div>
    {% if poster_when %}<div class="p-when">{{ poster_when }}</div>{% endif %}
  </div>
  {% endif %}
</div>

<div class="banner">
  <div class="lockup">
    <svg class="tower" viewBox="0 0 60 80" aria-hidden="true">
      <polygon points="10,18 30,6 50,18" fill="#4a4338"/>
      <line x1="10" y1="18" x2="50" y2="18" stroke="#e8dec4" stroke-width="1"/>
      <rect x="28" y="4" width="4" height="3" fill="#4a4338"/>
      <rect x="9" y="18" width="42" height="26" fill="#1f4c7a"/>
      <rect x="9" y="29" width="42" height="4" fill="#e8b84a"/>
      <rect x="21" y="18" width="5" height="26" fill="#e8b84a"/>
      <line x1="9" y1="18" x2="51" y2="18" stroke="#e8dec4" stroke-width=".6" opacity=".5"/>
      <line x1="9" y1="44" x2="51" y2="44" stroke="#e8dec4" stroke-width=".6" opacity=".5"/>
      <rect x="7" y="44" width="46" height="2.5" fill="#4a4338"/>
      <line x1="10" y1="41" x2="10" y2="46" stroke="#e8dec4" stroke-width=".7"/>
      <line x1="50" y1="41" x2="50" y2="46" stroke="#e8dec4" stroke-width=".7"/>
      <line x1="10" y1="41" x2="50" y2="41" stroke="#e8dec4" stroke-width=".7"/>
      <line x1="13" y1="46.5" x2="9"  y2="76" stroke="#e8dec4" stroke-width="2"/>
      <line x1="47" y1="46.5" x2="51" y2="76" stroke="#e8dec4" stroke-width="2"/>
      <line x1="24" y1="46.5" x2="23" y2="76" stroke="#e8dec4" stroke-width="1.6"/>
      <line x1="36" y1="46.5" x2="37" y2="76" stroke="#e8dec4" stroke-width="1.6"/>
      <line x1="10.5" y1="58" x2="49.5" y2="58" stroke="#e8dec4" stroke-width="1"/>
      <line x1="10" y1="68" x2="50" y2="68" stroke="#e8dec4" stroke-width="1"/>
      <line x1="11" y1="50" x2="23.5" y2="65" stroke="#e8dec4" stroke-width=".7"/>
      <line x1="23.3" y1="50" x2="10" y2="65" stroke="#e8dec4" stroke-width=".7"/>
      <line x1="49" y1="50" x2="36.5" y2="65" stroke="#e8dec4" stroke-width=".7"/>
      <line x1="36.7" y1="50" x2="50" y2="65" stroke="#e8dec4" stroke-width=".7"/>
    </svg>
    <div>
      <div class="wordmark">A<span class="apos">'</span>ville<span class="dot">.</span>net</div>
      <div class="sub">Andersonville · Chicago</div>
    </div>
  </div>
  <div class="pill">aville.net</div>
</div>

</body>
</html>
